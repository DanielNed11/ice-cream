<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your order is confirmed</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #111111; max-width: 600px; margin: 0 auto; padding: 0 16px;">

<div th:replace="~{email/fragments :: header}"></div>

<h1 style="font-size: 22px; margin: 28px 0 8px;">Thanks for your order!</h1>

<p style="font-size: 14px; line-height: 22px; color: #555555; margin: 0 0 24px;">
    Order <strong th:text="${orderReference}" style="color: #111111;">#A1B2C3D4</strong> is confirmed.
    We'll email you again when it's delivered.
</p>

<p th:each="item : ${items}" style="font-size: 14px; margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid #eeeeee;">
    <span th:text="${item.quantity} + '× ' + ${item.productName}">2× NANO BANANA</span>
    -
    <strong th:text="${item.lineTotal}">€17.98</strong>
    <span th:text="'(' + ${item.unitPrice} + ' each)'" style="color: #888888;">(€8.99 each)</span>
</p>

<p style="font-size: 16px; margin: 16px 0 28px;">
    Total: <strong th:text="${total}">€26.97</strong>
</p>

<a th:href="${frontendUrl}"
   style="background: #F4C430;
          color: #111111;
          padding: 12px 24px;
          text-decoration: none;
          border-radius: 6px;
          font-weight: bold;
          font-size: 14px;">
    Back to the shop
</a>

<div th:replace="~{email/fragments :: footer(${frontendUrl})}"></div>

</body>
</html>
