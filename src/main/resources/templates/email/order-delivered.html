<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your order has been delivered</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #111111; max-width: 600px; margin: 0 auto; padding: 0 16px;">

<div th:replace="~{email/fragments :: header}"></div>

<h1 style="font-size: 22px; margin: 28px 0 8px;">Your order has been delivered</h1>

<p style="font-size: 14px; line-height: 22px; color: #555555; margin: 0 0 28px;">
    Order <strong th:text="${orderReference}" style="color: #111111;">#A1B2C3D4</strong> has arrived.
    Enjoy your ice cream!
</p>

<a th:href="${frontendUrl}"
   style="background: #F4C430;
          color: #111111;
          padding: 12px 24px;
          text-decoration: none;
          border-radius: 6px;
          font-weight: bold;
          font-size: 14px;">
    Order again
</a>

<div th:replace="~{email/fragments :: footer(${frontendUrl})}"></div>

</body>
</html>
