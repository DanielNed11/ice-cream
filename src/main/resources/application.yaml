spring:
  application:
    name: Ice cream
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutes, in ms
  refresh-expiration: 604800000 # 7 days, in ms

---
# For production
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATASOURCE_URL}
    password: ${DATASOURCE_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

---
# For development
spring:
  config:
    activate:
      on-profile: dev

app:
  cors:
    allowed-origins: http://localhost:3000