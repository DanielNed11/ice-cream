spring:
  application:
    name: nano-ice-cream
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  liquibase:
    contexts: ${LIQUIBASE_CONTEXTS:default}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:8080}

management:
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutes, in ms
  refresh-expiration: 604800000 # 7 days, in ms

app:
  delivery:
    cron: "0 0 14 * * *"
    zone: "Europe/Sofia"
  restock:
    cron: "0 0 3 * * *"
    zone: "Europe/Sofia"
    amount: 10
  mail:
    from-name: "Nano Protein Ice Cream"


---
# For production
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATASOURCE_URL}
    password: ${DATASOURCE_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}
    resend:
      api-key: ${RESEND_API_KEY}
  frontend-url: ${FRONTEND_URL}

---
# For development
spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: localhost
    port: 1025

app:
  cors:
    allowed-origins: http://localhost:3000
  mail:
    from: ${MAIL_USERNAME}
  frontend-url: http://localhost:3000