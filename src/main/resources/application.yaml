spring:
  application:
    name: nano-ice-cream
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  liquibase:
    # Liquibase runs every changeset when no context is selected, so a context
    # alone guards nothing. Selecting "default" here means context-tagged
    # changesets (the demo admin) are skipped unless a deployment opts in with
    # LIQUIBASE_CONTEXTS=default,demo.
    contexts: ${LIQUIBASE_CONTEXTS:default}
  jpa:
    open-in-view: false
  threads:
    virtual:
      enabled: true
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  # Render (and most PaaS hosts) assign the port through PORT; Spring only
  # reads SERVER_PORT, so it is mapped explicitly here.
  port: ${PORT:8080}

management:
  health:
    mail:
      # The mail indicator opens an SMTP connection on every health check, so an
      # unreachable mail server marks the whole application DOWN and a platform
      # health check restarts it. Sending mail is deliberately best effort here
      # -- an outage must not fail an order -- so it does not gate liveness.
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutes, in ms
  refresh-expiration: 604800000 # 7 days, in ms

app:
  delivery:
    cron: "0 0 14 * * *"
    zone: "Europe/Sofia"
  restock:
    cron: "0 0 3 * * *"
    zone: "Europe/Sofia"
    amount: 10
  mail:
    from-name: "Nano Protein Ice Cream"


---
# For production
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATASOURCE_URL}
    password: ${DATASOURCE_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_USERNAME}
  frontend-url: ${FRONTEND_URL}

---
# For development
spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: localhost
    port: 1025

app:
  cors:
    allowed-origins: http://localhost:3000
  mail:
    from: ${MAIL_USERNAME}
  frontend-url: http://localhost:3000