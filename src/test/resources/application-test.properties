spring.datasource.url=jdbc:postgresql://${CI_DB_HOST_PORT:localhost:5434}/ice-cream-test
spring.datasource.username=spring
spring.datasource.password=spring
spring.sql.init.mode=never
spring.docker.compose.enabled=false

jwt.secret=aWNlLWNyZWFtLXRlc3Qtc2lnbmluZy1rZXktZG8tbm90LXVzZS1pbi1wcm9kISE=

app.cors.allowed-origins=http://localhost:3000
app.frontend-url=http://localhost:3000
app.mail.from=orders@test.local

# Far enough in the future that neither scheduled job can fire mid suite.
app.delivery.cron=0 0 0 1 1 *
app.delivery.zone=UTC
app.restock.cron=0 0 0 1 1 *
app.restock.zone=UTC

# No mail server in tests: the listeners log the failure and carry on, which is
# the behaviour under test anyway.
spring.mail.host=localhost
spring.mail.port=1025

# The mail health contributor looks for a concrete JavaMailSenderImpl, so a
# @MockitoBean JavaMailSender leaves it with nothing and breaks the whole
# health endpoint -- and with it the application context.
management.health.mail.enabled=false
