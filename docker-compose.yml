services:
  postgres-ice-cream-project:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: "ice-cream"
      POSTGRES_USER: "spring"
      POSTGRES_PASSWORD: "spring"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
volumes:
  db-data:
